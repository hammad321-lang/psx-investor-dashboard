<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSX Institutional Terminal</title>

<style>
:root{
    --bg:#070913;
    --card:#161b33;
    --surface:#0f1222;
    --accent:#dfb73c;
    --green:#2ecc71;
    --red:#e74c3c;
    --text:#fff;
    --muted:#8e96b7;
    --border:#232a4a;
}

body{
    margin:0;
    font-family:Segoe UI;
    background:var(--bg);
    color:var(--text);
    padding:20px;
}

.wrapper{max-width:1400px;margin:auto;display:flex;flex-direction:column;gap:20px}

header{
    background:var(--surface);
    padding:15px;
    border:1px solid var(--border);
    border-radius:10px;
    display:flex;
    justify-content:space-between;
}

.panel{
    background:var(--surface);
    border:1px solid var(--border);
    padding:15px;
    border-radius:10px;
}

.grid{
    display:grid;
    grid-template-columns:350px 1fr;
    gap:15px;
}

input,select{
    width:100%;
    padding:8px;
    margin-top:5px;
    background:#0b0e1a;
    border:1px solid var(--border);
    color:white;
    border-radius:6px;
}

button{
    padding:8px 12px;
    background:var(--accent);
    border:none;
    font-weight:bold;
    cursor:pointer;
}

.stat{
    display:flex;
    justify-content:space-between;
    margin-top:10px;
}

.value{
    color:var(--accent);
    font-weight:bold;
}

table{
    width:100%;
    border-collapse:collapse;
}

td,th{
    padding:8px;
    border-bottom:1px solid var(--border);
}

.green{color:var(--green)}
.red{color:var(--red)}
</style>

</head>

<body>

<div class="wrapper">

<header>
<h2>PSX Institutional Terminal</h2>
<div style="color:var(--accent)">Live API Engine</div>
</header>

<div class="grid">

<!-- LEFT -->
<div class="panel">

<h3>Asset Loader</h3>

<input id="tickerInput" placeholder="Enter Ticker (SYS, FFC...)">
<button onclick="loadAsset()">Load Asset</button>

<hr>

<label>Ticker</label>
<input id="ticker" readonly>

<label>Price</label>
<input id="price">

<label>Book Value</label>
<input id="bv">

<label>Shares</label>
<input id="shares">

<label>Sector</label>
<input id="sector">

<label>Shariah</label>
<select id="shariah">
<option>YES</option>
<option>NO</option>
</select>

</div>

<!-- RIGHT -->
<div class="panel">

<h3>Analytics</h3>

<div class="stat">
<span>P/B Ratio</span>
<span id="pb" class="value">-</span>
</div>

<div class="stat">
<span>Market Cap</span>
<span id="mc" class="value">-</span>
</div>

<div class="stat">
<span>Book Value Total</span>
<span id="bvTotal" class="value">-</span>
</div>

<hr>

<h3>Dividends</h3>

<table>
<thead>
<tr>
<th>Year</th>
<th>Dividend</th>
<th>Yield</th>
</tr>
</thead>
<tbody>
<tr><td>2025</td><td><input id="d1"></td><td id="y1"></td></tr>
<tr><td>2024</td><td><input id="d2"></td><td id="y2"></td></tr>
<tr><td>2023</td><td><input id="d3"></td><td id="y3"></td></tr>
<tr><td>2022</td><td><input id="d4"></td><td id="y4"></td></tr>
<tr><td>2021</td><td><input id="d5"></td><td id="y5"></td></tr>
</tbody>
</table>

</div>

</div>

</div>

<script src="app.js"></script>

</body>
</html>
